<!DOCTYPE html>
<html lang="en" data-theme-pref="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Amazon Dashboard</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 21V13M14 21V9M20 21V16M26 21V11' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">

<script>
/* Тема применяется ДО первой отрисовки: иначе при системной тёмной
   успевает мигнуть светлый фон. Язык ставится здесь же — атрибут lang
   влияет на переносы и на озвучку скринридером. */
(function () {
  try {
    var pref = localStorage.getItem("dashboard.theme") || "system";
    document.documentElement.setAttribute("data-theme-pref", pref);
    if (pref === "light" || pref === "dark") {
      document.documentElement.setAttribute("data-theme", pref);
    }
  } catch (e) {}
  try {
    var langs = ["ru", "en", "uk"];
    var saved = localStorage.getItem("dashboard.lang");
    var pick = null;
    if (saved && langs.indexOf(saved) !== -1) {
      pick = saved;
    } else {
      var list = navigator.languages && navigator.languages.length
        ? navigator.languages : [navigator.language || "en"];
      for (var i = 0; i < list.length && !pick; i++) {
        var base = String(list[i]).toLowerCase().split("-")[0];
        if (langs.indexOf(base) !== -1) pick = base;
      }
    }
    document.documentElement.lang = pick || "en";
  } catch (e) {}
})();
</script>
</head>

<body>

<a class="skip-link" href="#main" data-i18n="a11y.skipToContent">Skip to content</a>

<!-- =====================================================================
     Экран входа
     ================================================================== -->
<div class="login" id="login-view">
  <div class="login__card">

    <div class="login__brand">
      <svg class="login__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="var(--series-1)"></rect>
        <path d="M8 21V13M14 21V9M20 21V16M26 21V11" stroke="#fff"
              stroke-width="2.6" stroke-linecap="round"></path>
      </svg>
      <div>
        <div class="login__title" data-i18n="app.title">Amazon Sales Dashboard</div>
        <div class="login__subtitle" data-i18n="app.subtitle">Personal metrics workspace</div>
      </div>
    </div>

    <form class="login__form" id="login-form" autocomplete="on" novalidate>
      <h1 class="sr-only" data-i18n="login.heading">Sign in</h1>

      <div class="field">
        <label class="field__label" for="login-user" data-i18n="login.user">Username</label>
        <input class="input" id="login-user" name="username" type="text"
               autocomplete="username" required
               data-i18n-attr="placeholder:login.userPlaceholder">
      </div>

      <div class="field">
        <label class="field__label" for="login-password" data-i18n="login.password">Password</label>
        <div class="input-group">
          <input class="input" id="login-password" name="password" type="password"
                 autocomplete="current-password" required
                 data-i18n-attr="placeholder:login.passwordPlaceholder">
          <button class="input-group__action" id="toggle-password" type="button"
                  data-i18n-attr="aria-label:login.showPassword;title:login.showPassword">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"
                    stroke="currentColor" stroke-width="1.8"></path>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="alert alert--error" id="login-error" role="alert" hidden>
        <svg class="alert__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <span id="login-error-text"></span>
      </div>

      <button class="btn btn--primary" id="login-submit" type="submit">
        <span class="spinner" id="login-spinner" hidden></span>
        <span id="login-submit-text" data-i18n="login.submit">Sign in</span>
      </button>

      <p class="alert alert--info" id="login-hint" hidden>
        <span id="login-hint-text"></span>
      </p>

      <p class="card__caption" data-i18n="login.note">
        The data on this page is encrypted.
      </p>
    </form>

    <div class="login__footer">
      <div class="segmented" role="group" id="login-lang"
           data-i18n-attr="aria-label:nav.language"></div>
      <div class="segmented" role="group" id="login-theme"
           data-i18n-attr="aria-label:nav.theme"></div>
    </div>

  </div>
</div>

<!-- =====================================================================
     Рабочее пространство: меню слева, содержимое справа
     ================================================================== -->
<div class="app" id="app-view" hidden>

  <!-- ---------------------------------------------------------- меню --- -->
  <aside class="sidebar" id="sidebar" data-i18n-attr="aria-label:nav.mainMenu">

    <div class="sidebar__brand">
      <svg class="sidebar__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="var(--series-1)"></rect>
        <path d="M8 21V13M14 21V9M20 21V16M26 21V11" stroke="#fff"
              stroke-width="2.6" stroke-linecap="round"></path>
      </svg>
      <div>
        <div class="sidebar__title" data-i18n="app.title">Amazon</div>
        <div class="sidebar__subtitle" id="sidebar-store"></div>
      </div>
    </div>

    <nav class="sidebar__nav" id="sidebar-nav">
      <!-- Пункты меню строятся из описания в app.js: там же лежат
           заголовки для i18n, поэтому дублировать разметку не нужно -->
    </nav>

    <div class="sidebar__footer">
      <button class="btn btn--ghost" id="sign-out" type="button" data-i18n="nav.signOut">
        Sign out
      </button>
    </div>
  </aside>

  <!-- ------------------------------------------------------ содержимое --- -->
  <div class="content">

    <header class="topbar">
      <button class="btn btn--icon menu-toggle" id="menu-toggle" type="button"
              data-i18n-attr="aria-label:nav.mainMenu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round"></path>
        </svg>
      </button>

      <div class="topbar__heading">
        <div class="topbar__title" id="page-title"></div>
        <div class="topbar__meta" id="updated-at"></div>
      </div>

      <div class="topbar__tools">
        <button class="btn btn--icon bell" id="sync-bell" type="button"
                data-i18n-attr="aria-label:sync.title" aria-haspopup="dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 6.5-2.5 8.5h17c0-2-2.5-2-2.5-8.5Z"
                  stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path>
            <path d="M10.2 20.5a2.1 2.1 0 0 0 3.6 0" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"></path>
          </svg>
          <span class="bell__dot" id="sync-dot" hidden></span>
        </button>
        <div class="segmented" role="group" id="app-lang"
             data-i18n-attr="aria-label:nav.language"></div>
        <div class="segmented" role="group" id="app-theme"
             data-i18n-attr="aria-label:nav.theme"></div>
      </div>
    </header>

    <main class="main" id="main">

      <!-- Один ряд фильтров на всё, что ниже. Внутрь карточек не кладём -->
      <section class="filters" id="filters" aria-labelledby="filters-heading">
        <h2 class="sr-only" id="filters-heading" data-i18n="filter.period">Period</h2>

        <div class="filters__group">
          <label class="field__label" for="filter-period" data-i18n="filter.period">Period</label>
          <select class="select" id="filter-period"></select>
        </div>

        <div class="filters__group">
          <label class="field__label" for="filter-currency" data-i18n="filter.currency">Currency</label>
          <select class="select" id="filter-currency"></select>
        </div>

        <div class="filters__group">
          <label class="field__label" for="filter-marketplace" data-i18n="filter.marketplace">Marketplace</label>
          <select class="select" id="filter-marketplace"></select>
        </div>

        <p class="filters__note" data-i18n="filter.note"></p>
      </section>

      <section class="card" id="empty-state" hidden>
        <div class="empty">
          <svg class="empty__icon" width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 19V6M9 19V10M14 19V13M19 19V8" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round"></path>
            <path d="M3 21h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          </svg>
          <div class="empty__title" data-i18n="empty.title">No data yet</div>
          <p class="empty__text" data-i18n="empty.text"></p>
        </div>
      </section>

      <!-- ============================================================
           Страница: Анализ продаж
           ========================================================= -->
      <div id="page-sales" class="page" hidden>

        <section class="grid" aria-labelledby="sales-kpi-heading" style="margin-bottom:var(--sp-4)">
          <h2 class="sr-only" id="sales-kpi-heading" data-i18n="page.salesAnalysis">Sales analysis</h2>

          <div class="card span-6 rows-2 stat stat--hero" id="s-kpi-net"></div>
          <div class="card span-3 stat" id="s-kpi-revenue"></div>
          <div class="card span-3 stat" id="s-kpi-fees"></div>
          <div class="card span-3 stat" id="s-kpi-feeshare"></div>
          <div class="card span-3 stat" id="s-kpi-refunds"></div>
        </section>

        <section class="grid grid--top">

          <!-- Выручка и чистый доход: обе величины в одной валюте,
               поэтому одна шкала. Двух осей Y здесь быть не должно. -->
          <figure class="card span-8" id="card-s-trend">
            <div class="card__head">
              <div>
                <figcaption class="card__title" data-i18n="chart.revenueVsNet"></figcaption>
                <div class="card__subtitle" id="s-trend-range"></div>
              </div>
              <button class="card__toggle" type="button" data-table-toggle="s-trend"
                      aria-pressed="false" data-i18n="table.show"></button>
            </div>
            <div class="chart" id="chart-s-trend"></div>
            <div id="legend-s-trend"></div>
            <div id="table-s-trend" hidden></div>
            <p class="card__caption" data-i18n="chart.revenueVsNetCaption"></p>
          </figure>

          <!-- Структура расходов: часть-целое -> стопочная полоса -->
          <figure class="card span-4" id="card-s-mix">
            <div class="card__head">
              <div>
                <figcaption class="card__title" data-i18n="chart.feeMix"></figcaption>
              </div>
              <button class="card__toggle" type="button" data-table-toggle="s-mix"
                      aria-pressed="false" data-i18n="table.show"></button>
            </div>
            <div class="chart" id="chart-s-mix"></div>
            <div id="legend-s-mix"></div>
            <div id="table-s-mix" hidden></div>
            <p class="card__caption" data-i18n="chart.feeMixCaption"></p>
          </figure>

          <!-- Комиссии по типам: одна серия -> один цвет на все столбцы -->
          <figure class="card span-6" id="card-s-fees">
            <div class="card__head">
              <div>
                <figcaption class="card__title" data-i18n="chart.feesByType"></figcaption>
              </div>
              <button class="card__toggle" type="button" data-table-toggle="s-fees"
                      aria-pressed="false" data-i18n="table.show"></button>
            </div>
            <div class="chart" id="chart-s-fees"></div>
            <div id="table-s-fees" hidden></div>
            <p class="card__caption" data-i18n="chart.feesByTypeCaption"></p>
          </figure>

          <figure class="card span-6" id="card-s-products">
            <div class="card__head">
              <div>
                <figcaption class="card__title" data-i18n="chart.topByNet"></figcaption>
              </div>
              <button class="card__toggle" type="button" data-table-toggle="s-products"
                      aria-pressed="false" data-i18n="table.show"></button>
            </div>
            <div class="chart" id="chart-s-products"></div>
            <div id="table-s-products" hidden></div>
            <p class="card__caption" data-i18n="chart.topByNetCaption"></p>
          </figure>

        </section>
      </div>

      <!-- ============================================================
           Страница: Обзор продаж
           ========================================================= -->
      <div id="page-overview" class="page" hidden>

        <section class="grid" aria-labelledby="kpi-heading" style="margin-bottom:var(--sp-4)">
          <h2 class="sr-only" id="kpi-heading" data-i18n="kpi.revenue">Revenue</h2>

          <div class="card span-6 rows-2 stat stat--hero" id="kpi-revenue"></div>
          <div class="card span-3 stat" id="kpi-units"></div>
          <div class="card span-3 stat" id="kpi-orders"></div>
          <div class="card span-3 stat" id="kpi-avg"></div>
          <div class="card span-3 stat" id="kpi-skus"></div>
        </section>

        <section class="grid grid--top">

          <figure class="card span-8" id="card-revenue">
            <div class="card__head">
              <div>
                <figcaption class="card__title" data-i18n="chart.revenueOverTime"></figcaption>
                <div class="card__subtitle" id="revenue-range"></div>
              </div>
              <button class="card__toggle" type="button" data-table-toggle="revenue"
                      aria-pressed="false" data-i18n="table.show"></button>
            </div>
            <div class="chart" id="chart-revenue"></div>
            <div id="table-revenue" hidden></div>
            <p class="card__caption" data-i18n="chart.revenueOverTimeCaption"></p>
          </figure>

          <figure class="card span-4" id="card-marketplace">
            <div class="card__head">
              <div>
                <figcaption class="card__title" data-i18n="chart.byMarketplace"></figcaption>
              </div>
              <button class="card__toggle" type="button" data-table-toggle="marketplace"
                      aria-pressed="false" data-i18n="table.show"></button>
            </div>
            <div class="chart" id="chart-marketplace"></div>
            <div id="legend-marketplace"></div>
            <div id="table-marketplace" hidden></div>
            <p class="card__caption" data-i18n="chart.byMarketplaceCaption"></p>
          </figure>

          <figure class="card span-6" id="card-units">
            <div class="card__head">
              <div>
                <figcaption class="card__title" data-i18n="chart.unitsOverTime"></figcaption>
              </div>
              <button class="card__toggle" type="button" data-table-toggle="units"
                      aria-pressed="false" data-i18n="table.show"></button>
            </div>
            <div class="chart" id="chart-units"></div>
            <div id="table-units" hidden></div>
          </figure>

          <figure class="card span-6" id="card-skus">
            <div class="card__head">
              <div>
                <figcaption class="card__title" data-i18n="chart.topSkus"></figcaption>
              </div>
              <button class="card__toggle" type="button" data-table-toggle="skus"
                      aria-pressed="false" data-i18n="table.show"></button>
            </div>
            <div class="chart" id="chart-skus"></div>
            <div id="table-skus" hidden></div>
            <p class="card__caption" data-i18n="chart.topSkusCaption"></p>
          </figure>

        </section>
      </div>

      <!-- Заглушка для разделов, которых ещё нет -->
      <div id="page-placeholder" class="page" hidden>
        <section class="card">
          <div class="empty">
            <svg class="empty__icon" width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"></rect>
              <path d="M3 10h18" stroke="currentColor" stroke-width="1.6"></path>
            </svg>
            <div class="empty__title" id="placeholder-title"></div>
            <p class="empty__text" data-i18n="page.soonText"></p>
          </div>
        </section>
      </div>

    </main>

    <footer class="footer">
      <span data-i18n="footer.note"></span>
    </footer>
  </div>
</div>

<!-- Модальное окно журнала синхронизаций. Нативный <dialog>: фокус-ловушка,
     закрытие по Esc и подложка достаются бесплатно и работают правильно. -->
<dialog class="modal" id="sync-modal" aria-labelledby="sync-modal-title">
  <div class="modal__head">
    <div>
      <h2 class="modal__title" id="sync-modal-title" data-i18n="sync.title">Синхронизация</h2>
      <p class="modal__subtitle" id="sync-schedule"></p>
    </div>
    <button class="btn btn--icon" id="sync-close" type="button"
            data-i18n-attr="aria-label:sync.close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round"></path>
      </svg>
    </button>
  </div>
  <div class="modal__body" id="sync-list"></div>
  <div class="modal__foot">
    <a class="link" id="sync-more" href="logs.html" data-i18n="sync.more">Подробнее</a>
  </div>
</dialog>

<!-- Порядок важен: i18n и Fmt нужны charts.js и app.js -->
<script src="assets/js/i18n.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/vault.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/runs.js"></script>
<!-- Зашифрованные данные. Отдельным файлом, чтобы обновлять их не трогая код.
     Загружается как обычный скрипт, а не через fetch — тогда страница
     одинаково работает и на GitHub Pages, и открытая с диска. -->
<script src="data/dashboard.enc.js" onerror="window.__DASHBOARD_MISSING__=true"></script>
<!-- Журнал синхронизаций. НЕ шифруется намеренно: причину сбоя нужно видеть
     и тогда, когда войти нельзя. Внутри только эксплуатационные данные —
     времена, статусы, тексты ошибок. Денег и SKU здесь нет. -->
<script src="data/runs.js" onerror="window.__RUNS_MISSING__=true"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
